$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
properties:
  schema_version:
    const: 1
  description: &id001
    type: string
    maxLength: 256
    pattern: ^[^\x00-\x1f\x7f-\x9f]*$
  model_profile:
    type: string
    pattern: ^[a-z][a-z0-9-]{0,63}$
  assessment_depth:
    enum:
    - quick
    - standard
    - thorough
  budget:
    type: number
    exclusiveMinimum: 0
  max_calls:
    description: Maximum model exchanges for a CLI subscription assessment, including retries.
    type: integer
    minimum: 1
    maximum: 47256
  max_parallel:
    description: Maximum number of components assessed at once.
    type: integer
    minimum: 1
    maximum: 16
  outputs:
    type: array
    maxItems: 7
    uniqueItems: true
    items:
      enum:
      - markdown
      - yaml
      - html
      - pdf
      - sarif
      - threatdragon
      - pentest-tasks
  abuse_case_files:
    description: Explicit YAML case files relative to the selected repository root.
    type: array
    maxItems: 32
    uniqueItems: true
    items:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: ^[^\x00-\x1f\x7f-\x9f]*$
  report:
    type: object
    additionalProperties: false
    properties:
      attributes:
        type: object
        maxProperties: 32
        propertyNames:
          pattern: ^[a-zA-Z][a-zA-Z0-9_.-]{0,63}$
        additionalProperties: *id001
required:
- schema_version
