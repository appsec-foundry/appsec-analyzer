$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
properties:
  schema_version:
    const: 1
  description: &id001
    type: string
    maxLength: 256
    pattern: ^[^\x00-\x1f\x7f-\x9f]*$
  model_profile:
    type: string
    pattern: ^[a-z][a-z0-9-]{0,63}$
  assessment_depth:
    enum:
    - quick
    - standard
    - thorough
  budget:
    type: number
    exclusiveMinimum: 0
  max_calls:
    description: Maximum model exchanges for a CLI subscription assessment, including retries.
    type: integer
    minimum: 1
    maximum: 47256
  max_parallel:
    description: Maximum number of components assessed at once.
    type: integer
    minimum: 1
    maximum: 16
  test_cases:
    description: >-
      The verification method beside the survey. Without the setting each depth uses its default from
      data/assessment-depths.yaml or the organization profile, and `depths.<depth>.verify` wins over it.
      A boolean enables or disables the verification items for every depth, without a model investigation
      when true; the object selects the verified aspects for every depth and disables named verification
      items with a reason.
    oneOf:
    - type: boolean
    - type: object
      additionalProperties: false
      properties:
        aspects:
          description: >-
            Aspects whose verification items a model investigates at every depth; without it each depth
            keeps its default aspects.
          $ref: "#/$defs/test_case_aspects"
        disable:
          description: Test cases to leave out of the assessment, each with the reason.
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - reason
            properties:
              id:
                type: string
                pattern: ^TC-[A-Z]+-[0-9]{2}$
              reason:
                type: string
                minLength: 1
                maxLength: 300
                pattern: ^[^\x00-\x1f\x7f-\x9f]*$
  depths:
    description: >-
      The team's values for single assessment depths. Each key changes the default from
      data/assessment-depths.yaml or the organization profile for that depth only.
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      quick: { $ref: "#/$defs/depth_settings" }
      standard: { $ref: "#/$defs/depth_settings" }
      thorough: { $ref: "#/$defs/depth_settings" }
  check_abuse_cases:
    description: Abuse cases that every run checks, by ID, within the limit for requested cases.
    $ref: "#/$defs/abuse_case_ids"
  skip_abuse_cases:
    description: Abuse cases that no run checks, by ID.
    $ref: "#/$defs/abuse_case_ids"
  outputs:
    type: array
    maxItems: 7
    uniqueItems: true
    items:
      enum:
      - markdown
      - yaml
      - html
      - pdf
      - sarif
      - threatdragon
      - pentest-tasks
  abuse_case_files:
    description: Explicit YAML case files relative to the selected repository root.
    type: array
    maxItems: 32
    uniqueItems: true
    items:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: ^[^\x00-\x1f\x7f-\x9f]*$
  report:
    type: object
    additionalProperties: false
    properties:
      attributes:
        type: object
        maxProperties: 32
        propertyNames:
          pattern: ^[a-zA-Z][a-zA-Z0-9_.-]{0,63}$
        additionalProperties: *id001
required:
- schema_version
$defs:
  test_case_aspects:
    type: array
    minItems: 1
    maxItems: 6
    uniqueItems: true
    items:
      enum:
      - IAM
      - SessionMgmt
      - AuthZ
      - InputVal
      - DataProt
      - AI
  depth_settings:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      verify:
        description: Security aspects that verification checks beside the survey; an empty list runs the survey only.
        type: array
        maxItems: 6
        uniqueItems: true
        items:
          enum:
          - IAM
          - SessionMgmt
          - AuthZ
          - InputVal
          - DataProt
          - AI
      abuse_cases:
        description: Optional business abuse cases checked; 0 checks only cases that are asked for.
        type: integer
        minimum: 0
        maximum: 16
      derived_abuse_cases:
        description: Business abuse cases the model may add from the application's own rules.
        type: integer
        minimum: 0
        maximum: 6
      architect_review:
        description: Whether a second model call reviews the findings.
        type: boolean
      actor_discovery:
        description: Whether the assessment identifies the users and systems around the application.
        type: boolean
      budget:
        description: USD of a run started through the Claude Code assessment dialogue without a budget.
        type: number
        exclusiveMinimum: 0
        maximum: 1000
  abuse_case_ids:
    type: array
    maxItems: 64
    uniqueItems: true
    items:
      type: string
      pattern: ^(AC-T|AC-B|AC|ORG-AC|REPO-AC)-[0-9]{3,}$
