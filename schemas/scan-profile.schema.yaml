$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
properties:
  schema_version:
    const: 1
  description: &id001
    type: string
    maxLength: 256
    pattern: ^[^\x00-\x1f\x7f-\x9f]*$
  model_profile:
    type: string
    pattern: ^[a-z][a-z0-9-]{0,63}$
  assessment_depth:
    enum:
    - quick
    - standard
    - thorough
  budget:
    type: number
    exclusiveMinimum: 0
  outputs:
    type: array
    maxItems: 7
    uniqueItems: true
    items:
      enum:
      - markdown
      - yaml
      - html
      - pdf
      - sarif
      - threatdragon
      - pentest-tasks
  report:
    type: object
    additionalProperties: false
    properties:
      attributes:
        type: object
        maxProperties: 32
        propertyNames:
          pattern: ^[a-zA-Z][a-zA-Z0-9_.-]{0,63}$
        additionalProperties: *id001
required:
- schema_version
