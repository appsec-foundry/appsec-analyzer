$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
properties:
  schema_version:
    const: 1
  description: &id001
    type: string
    maxLength: 256
    pattern: ^[^\x00-\x1f\x7f-\x9f]*$
  model_profile:
    type: string
    pattern: ^[a-z][a-z0-9-]{0,63}$
  assessment_depth:
    enum:
    - quick
    - standard
    - thorough
  budget:
    type: number
    exclusiveMinimum: 0
  max_calls:
    description: Maximum model exchanges for a codex-cli subscription assessment, including retries.
    type: integer
    minimum: 1
    maximum: 47256
  max_parallel:
    description: Maximum number of components assessed at once.
    type: integer
    minimum: 1
    maximum: 16
  test_cases:
    description: >-
      Evaluate the security test cases during the assessment. A boolean enables or disables the
      scanner-based test cases; the object selects aspects and disables named test cases with a reason.
    oneOf:
    - type: boolean
    - type: object
      additionalProperties: false
      properties:
        aspects:
          description: Pilot aspects whose test cases a model investigates; none when omitted.
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            enum:
            - IAM
            - SessionMgmt
            - AuthZ
            - InputVal
            - DataProt
        disable:
          description: Test cases to leave out of the assessment, each with the reason.
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - reason
            properties:
              id:
                type: string
                pattern: ^TC-[A-Z]+-[0-9]{2}$
              reason:
                type: string
                minLength: 1
                maxLength: 300
                pattern: ^[^\x00-\x1f\x7f-\x9f]*$
  outputs:
    type: array
    maxItems: 7
    uniqueItems: true
    items:
      enum:
      - markdown
      - yaml
      - html
      - pdf
      - sarif
      - threatdragon
      - pentest-tasks
  abuse_case_files:
    description: Explicit YAML case files relative to the selected repository root.
    type: array
    maxItems: 32
    uniqueItems: true
    items:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: ^[^\x00-\x1f\x7f-\x9f]*$
  report:
    type: object
    additionalProperties: false
    properties:
      attributes:
        type: object
        maxProperties: 32
        propertyNames:
          pattern: ^[a-zA-Z][a-zA-Z0-9_.-]{0,63}$
        additionalProperties: *id001
required:
- schema_version
