$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
properties:
  schema_version:
    const: 1
  description:
    type: string
    maxLength: 256
    pattern: ^[^\x00-\x1f\x7f-\x9f]*$
  base:
    enum:
    - claude
    - codex
    - codex-cli
    - lite
    - bedrock
  adapter:
    enum:
    - openai
    - claude-cli
    - codex-cli
    - lite
    - bedrock
  defaults: &id001
    type: object
    additionalProperties: false
    properties:
      model:
        type: string
        pattern: ^(?:(?:lite|bedrock) )?[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$
      reasoning_effort:
        enum:
        - none
        - low
        - medium
        - high
        - xhigh
        - max
      max_output_tokens:
        type: integer
        minimum: 1
        maximum: 128000
  roles: &id002
    type: object
    additionalProperties: false
    properties:
      abuse_case_deriver: *id001
      abuse_case_verifier: *id001
      actor_discoverer: *id001
      architecture_analyst: *id001
      architect_reviewer: *id001
      control_analyst: *id001
      evidence_verifier: *id001
      post_stride_synthesizer: *id001
      recon_scanner: *id001
      stride_analyzer: *id001
      threat_merger: *id001
      triage_validator: *id001
      trust_boundary_analyst: *id001
      ms_renderer: *id001
      secarch_renderer: *id001
  depths:
    type: object
    additionalProperties: false
    properties:
      quick:
        type: object
        additionalProperties: false
        properties:
          defaults: *id001
          roles: *id002
      standard:
        type: object
        additionalProperties: false
        properties:
          defaults: *id001
          roles: *id002
      thorough:
        type: object
        additionalProperties: false
        properties:
          defaults: *id001
          roles: *id002
required:
- schema_version
oneOf:
- required:
  - base
  not:
    required:
    - adapter
- required:
  - adapter
  not:
    required:
    - base
