$schema: https://json-schema.org/draft/2020-12/schema
title: Installed organization distribution
type: object
additionalProperties: false
required: [schema_version, engine_version, interface_version, command, scan_profile, org_profile]
properties:
  schema_version:
    const: 1
  engine_version:
    type: string
    minLength: 1
    maxLength: 80
  interface_version:
    type: integer
    minimum: 1
  command:
    type: string
    pattern: '^[a-z][a-z0-9-]{0,63}$'
  scan_profile:
    type: string
    minLength: 1
    maxLength: 240
  org_profile:
    type: string
    minLength: 1
    maxLength: 240
