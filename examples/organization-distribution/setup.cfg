[metadata]
name = nordlicht-appsec
version = 1.0.0
description = Example internal AppSec distribution for the fictional Nordlicht organization
license = Apache-2.0

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    appsec-analyzer==0.1.0a0

[options.packages.find]
where = src

[options.package_data]
nordlicht_appsec =
    *.yaml
    profiles/*.yaml
    model-profiles/*.yaml
    context/*.md
    abuse-cases/*.yaml
    requirements/*.yaml

[options.entry_points]
console_scripts =
    nordlicht-appsec = nordlicht_appsec.cli:main
