# code-sites.yaml: fixed patterns that mark code sites as starting points of test cases (REQ-040).
#
# A site is a line of comment-blanked code outside test files that a pattern
# matches. It is a hint for the model investigation, never a verdict. A test
# case names a kind in its starting points as ``code_sites.<kind>``; a route
# whose resolved handler reaches a site of that kind becomes the candidate, and
# a site no route of the component reaches becomes a candidate of its own.
#
# A kind takes its pattern from ``patterns`` (alternatives, joined), from the
# applicability ``signal`` of the same name in model/case_candidates.py, or
# from ``source: egress_clients``, the outbound calls whose destination the
# request chooses. ``scope: model`` limits a kind to files that define data
# models. ``anchor: site`` makes every site a candidate of its own, also where
# routes reach it, and lists those routes in ``reached_by``: the site answers
# the test case for each route that runs it, as a token check in a shared
# guard does. ``matches`` and ``ignores`` are lines the pattern must and must not
# mark; tests/test_case_candidates.py checks them. Structure:
# schemas/code-sites.schema.yaml.
version: 1
model_file:
- 'sequelize\.define\s*\('
- '\.init\s*\(\s*\{'
- 'DataTypes\.'
- '\bmongoose\.Schema\b'
- '\bnew\s+Schema\s*\('
- '@Column\b'
- '\bmodels\.Model\b'
- '\bdb\.Column\s*\('
kinds:
- kind: raw_query
  description: a query runs from a string, which may contain input
  patterns:
  - '\.(?:query|raw|rawQuery|execute|executemany|executeQuery|executeUpdate)\s*\('
  - '\.\$(?:queryRaw|executeRaw|queryRawUnsafe|executeRawUnsafe)\s*\('
  - '\bknex\.raw\s*\('
  - '\bcreateStatement\s*\('
  matches:
  - "models.sequelize.query(`SELECT * FROM Users WHERE email = '${req.body.email}'`)"
  - 'cursor.execute("SELECT * FROM users WHERE id = %s" % uid)'
  - 'await prisma.$queryRawUnsafe(sql)'
  ignores:
  - 'Product.findAll({ where: { id: req.params.id } })'
  - 'const term = req.query.q'
- kind: nosql_query
  description: a document store query on a collection, or a $where expression
  patterns:
  - '\$where\b'
  - '\b\w{0,64}[Cc]ollection\s*\.\s*(?:find|findOne|update|updateOne|updateMany|remove|deleteOne|deleteMany|count|countDocuments|aggregate)\s*\('
  - '\bdb\s*\.\s*collection\s*\('
  matches:
  - "db.reviewsCollection.find({ $where: 'this.product == ' + id })"
  - 'db.reviewsCollection.update({ _id: req.body.id }, { $set: { message } })'
  - "const users = db.collection('users')"
  ignores:
  - 'UserModel.findOne({ where: { email } })'
  - 'await user.update({ password: newPassword })'
  - 'items.find(item => item.id === id)'
- kind: command
  description: code runs a command, evaluates code, or compiles a template
  signal: command_execution
  matches:
  - 'const result = vm.runInContext(code, sandbox)'
  - 'exec(`convert ${file} out.png`)'
  ignores:
  - 'const executor = new Executor()'
- kind: html_output
  description: content reaches HTML without the framework's encoding
  patterns:
  - 'bypassSecurityTrust(?:Html|Script|Style|Url|ResourceUrl)\s*\('
  - '\[innerHTML\]\s*='
  - '\.(?:innerHTML|outerHTML)\s*='
  - 'insertAdjacentHTML\s*\('
  - 'document\.write\s*\('
  - 'dangerouslySetInnerHTML'
  - '\bv-html\b'
  - '\.html\s*\(\s*[^)\s]'
  - '<%-'
  - '\{\{\{'
  - '\|\s*safe\b'
  - '\bres\.(?:send|write|end)\s*\([^)\n]*(?:\+|\$\{)'
  matches:
  - 'this.sanitizer.bypassSecurityTrustHtml(this.searchValue)'
  - '<div [innerHTML]="product.description"></div>'
  - "res.send('<h1>' + req.query.name + '</h1>')"
  ignores:
  - '<div>{{ product.description }}</div>'
  - 'res.send(result)'
- kind: parser
  description: code parses XML or deserializes data
  signal: xml_or_deserialization
  matches:
  - 'const doc = libxml.parseXml(data, { noent: true })'
  ignores:
  - 'const data = JSON.stringify(order)'
- kind: file_path
  description: code reads, writes, or serves a file by path
  signal: file_access
  matches:
  - 'res.sendFile(path.resolve("ftp/", file))'
  ignores:
  - 'const fileName = "report.pdf"'
- kind: upload
  description: code accepts uploads or extracts archives
  signal: uploads_or_archives
  matches:
  - 'const upload = multer({ storage })'
  ignores:
  - 'const uploaded = true'
- kind: transport
  description: code starts a server or sets transport security
  ignore_case: true
  patterns:
  - 'rejectUnauthorized\s*:\s*false'
  - 'NODE_TLS_REJECT_UNAUTHORIZED'
  - '\bsecure\s*:\s*false'
  - '\bhelmet\b'
  - '\bhsts\b'
  - 'strictTransportSecurity'
  - '\bhttps?\.createServer\s*\('
  - '\b(?:app|server)\.listen\s*\('
  matches:
  - 'const agent = new https.Agent({ rejectUnauthorized: false })'
  - 'app.listen(port)'
  - "res.cookie('token', token, { secure: false })"
  ignores:
  - 'const server = createWorker()'
- kind: sensitive_field
  description: a data model defines a credential, payment, or personal secret field
  scope: model
  ignore_case: true
  patterns:
  - '^\s*(?:password|passwd|pwd|totpSecret|secret\w*|token\w*|api_?key|card_?num\w*|card_?number|cvv|ssn|security_?answer|answer|iban|account_?number)\s*[:=(]'
  matches:
  - '  password: {'
  - '  cardNum: DataTypes.INTEGER,'
  ignores:
  - '  email: {'
  - 'const password = req.body.password'
- kind: client_storage
  description: browser code keeps a credential in storage that scripts can read
  patterns:
  - '\b(?:localStorage|sessionStorage)\s*\.\s*setItem\s*\(\s*[''"`](?i:[\w.\-]{0,40}?(?:token|jwt|auth|session|passw|secret|credential|api_?key|bearer))'
  - '\b(?:localStorage|sessionStorage)\s*(?:\[\s*[''"`]|\.\s*)(?i:[\w.\-]{0,40}?(?:token|jwt|auth|session|passw|secret|credential|api_?key|bearer))[\w.\-]*(?:[''"`]\s*\])?\s*=(?!=)'
  - '\b(?:cookieService|Cookies)\s*\.\s*(?:put|set)\w*\s*\(\s*[''"`](?i:[\w.\-]{0,40}?(?:token|jwt|auth|session|passw|secret|credential|api_?key|bearer))'
  - '\bdocument\.cookie\s*=\s*[''"`](?i:[\w.\-]{0,40}?(?:token|jwt|auth|session|passw|secret|credential|api_?key|bearer))'
  matches:
  - "localStorage.setItem('token', authentication.token)"
  - "sessionStorage.setItem('refresh_token', data.refreshToken)"
  - "localStorage['authToken'] = token"
  - "this.cookieService.put('token', authentication.token, { expires })"
  - "Cookies.set('jwt', token)"
  - "document.cookie = 'session=' + id"
  ignores:
  - "sessionStorage.setItem('bid', authentication.bid)"
  - "this.cookieService.put('language', langKey, { expires })"
  - "const token = localStorage.getItem('token')"
  - "if (localStorage.token === stored) {"
  - "res.cookie('token', token, { httpOnly: true })"
- kind: outbound_request
  description: an outbound call goes to a destination the request chooses
  source: egress_clients
- kind: llm_call
  description: code calls a language model or defines a tool the model may call
  patterns:
  - '\b(?:generateText|streamText|generateObject|streamObject)\s*\('
  - '\btool\s*\(\s*\{'
  - '\bchat\s*\.\s*completions\s*\.\s*create\s*\('
  - '\bmessages\s*\.\s*create\s*\('
  - '\bresponses\s*\.\s*create\s*\('
  - '\bgenerateContent\s*\('
  # SDKs of other languages and providers; the AI items apply only where the code or the architecture
  # already shows a model call, so these count only in such components.
  - '\.\s*(?:chat\s*\(\s*\)\s*\.\s*completions|messages|responses)\s*\(\s*\)\s*\.\s*create\s*\('
  - '\.\s*(?:Chat\s*\.\s*Completions|Messages|Responses)\s*\.\s*New\s*\('
  - '\bCreateChatCompletion(?:Stream)?\s*\('
  - '\b(?:GetChatCompletions|CompleteChat)(?:Streaming)?(?:Async)?\s*\('
  - '\b(?:InvokeModel|invokeModel|invoke_model)(?:WithResponseStream|_with_response_stream)?\s*\('
  - '\bConverse(?:Stream)?Command\b|\.\s*converse(?:_stream)?\s*\('
  - '\blitellm\s*\.\s*a?completion\s*\('
  - '->\s*chat\s*\(\s*\)\s*->\s*create\s*\('
  matches:
  - 'const result = streamText({ model, system: systemPrompt, messages })'
  - 'const completion = await client.chat.completions.create({ model, messages })'
  - 'lookupOrder: tool({ description, inputSchema, execute })'
  - 'ChatCompletion completion = client.chat().completions().create(params);'
  - 'resp, err := client.Chat.Completions.New(ctx, params)'
  - 'resp, err := client.CreateChatCompletion(ctx, request)'
  - 'ChatCompletion completion = await chatClient.CompleteChatAsync(messages);'
  - 'response = bedrock.invoke_model(modelId=model_id, body=body)'
  - 'const response = await client.send(new ConverseCommand(input))'
  - 'response = litellm.completion(model=model, messages=messages)'
  - '$result = $client->chat()->create($parameters);'
  ignores:
  - 'const text = generateId()'
  - 'const invoke = handlers[name]'
  - 'messages.push(message)'
  - 'const completion = await completions.next()'
- kind: token_handling
  description: code signs, decodes, or verifies a token
  anchor: site
  patterns:
  - '\b(?:jwt|jws|jose|jsonwebtoken|JWT|Jwts|jwtService|JwtService)\s*\.\s*(?:sign|verify|decode|encode|parse|Parse|require|create|parser|builder)\w{0,24}\b'
  - '\b(?:jwtVerify|jwtDecrypt|compactVerify|decodeJwt|jwtDecode|jwt_decode|expressjwt|expressJwt|koaJwt)\s*\('
  - '\bnew\s+(?:JwtStrategy|SignJWT|JwtSecurityTokenHandler)\b'
  - '\.(?:ValidateToken|ReadJwtToken)\s*\('
  - '\bJWT::(?:encode|decode)\s*\('
  matches:
  - 'jwt.verify(token, publicKey, (err: Error | null, decoded: any) => {'
  - 'export const isAuthorized = () => expressJwt(({ secret: publicKey }) as any)'
  - 'payload = jwt.decode(token, SECRET_KEY, algorithms=["HS256"])'
  - 'token, err := jwt.Parse(raw, keyFunc)'
  - 'DecodedJWT decoded = JWT.require(algorithm).build().verify(token);'
  - 'passport.use(new JwtStrategy(options, verify))'
  - 'const verifyToken = promisify(jwt.verify)'
  ignores:
  - '(err: jwt.VerifyErrors | null) => {'
  - 'const options: jwt.SignOptions = { expiresIn }'
  - "import jwt from 'jsonwebtoken'"
  - 'const jwtSecret = process.env.JWT_SECRET'
  - 'const token = req.headers.authorization'
- kind: password_hash
  description: code hashes, compares, or checks a password
  anchor: site
  patterns:
  - '\b(?:bcrypt\w{0,12}|argon2\w{0,12}|scrypt\w{0,12})\s*\.\s*(?:hash|compare|verify|genSalt|gen_salt|hashpw|checkpw)\w{0,12}\s*\('
  - '\b(?:hashpw|checkpw|password_hash|password_verify|check_password|check_password_hash|generate_password_hash|make_password|set_password|pbkdf2Sync|pbkdf2_hmac)\s*\('
  - '\b(?:passwordEncoder|PasswordEncoder|passwordHasher|PasswordHasher)\s*\.\s*(?:encode|matches|hash|verify|HashPassword|VerifyHashedPassword)\s*\('
  - '(?:[Hh]ash|HASH|md5|MD5|[Ss]ha(?:1|224|256|384|512)|[Dd]igest|[Ee]ncrypt)\w{0,12}\s*\(\s*[^)\n]{0,120}(?i:passw|pwd)'
  - '\.update\s*\(\s*[\w.]{0,60}(?i:passw|pwd)'
  matches:
  - "this.setDataValue('password', security.hash(clearTextPassword))"
  - 'const valid = await bcrypt.compare(password, user.passwordHash)'
  - 'user.password = generate_password_hash(form.password.data)'
  - 'String encoded = passwordEncoder.encode(rawPassword);'
  - 'digest = hashlib.sha256(password.encode()).hexdigest()'
  - "crypto.createHash('md5').update(req.body.password).digest('hex')"
  ignores:
  - "const checksum = crypto.createHash('sha256').update(fileContent).digest('hex')"
  - "const passwordInput = document.getElementById('password')"
  - 'await user.update({ password: newPassword })'
- kind: password_field
  description: a data model defines a password field
  scope: model
  ignore_case: true
  patterns:
  - '^[ \t]*(?:password(?:_?hash|_?digest|_?salt)?|passwd|pwd|hashed_?password|encrypted_?password)[ \t]*[:=(]'
  - '^[ \t]*(?:(?:private|protected|public|internal)[ \t]+)?string[ \t]+(?:password(?:_?hash|_?digest)?|hashed_?password)[ \t]*[;={]'
  matches:
  - '      password: {'
  - '    password = models.CharField(max_length=128)'
  - '    private String password;'
  - '    hashed_password = Column(String(128))'
  - '    public string PasswordHash { get; set; }'
  ignores:
  - '  email: {'
  - '  passwordResetToken: {'
  - 'const password = req.body.password'
- kind: channel
  description: code registers a WebSocket, GraphQL, or message handler that callers reach outside the route inventory
  anchor: site
  patterns:
  - '\b(?:io|socket|ws|wss|nsp|namespace)\s*\.\s*on\s*\(\s*[''"`]'
  - '\bnew\s+(?:WebSocketServer|WebSocket\.Server|ws\.Server|ApolloServer)\s*\('
  - '@(?:WebSocketGateway|SubscribeMessage|Resolver|Mutation|Subscription|MessageMapping|SubscribeMapping|QueryMapping|MutationMapping|SchemaMapping|ServerEndpoint)\b'
  - '@\w{1,40}\s*\.\s*(?:websocket|on)\s*\('
  - '\bupgrader\s*\.\s*Upgrade\s*\('
  - '\bMapHub\s*<'
  matches:
  - "  io.on('connection', (socket: any) => {"
  - "    socket.on('notification received', (data: any) => {"
  - 'const wss = new WebSocketServer({ server })'
  - 'const server = new ApolloServer({ typeDefs, resolvers })'
  - "@SubscribeMessage('events')"
  - "@socketio.on('message')"
  - 'conn, err := upgrader.Upgrade(w, r, nil)'
  ignores:
  - "process.on('uncaughtException', handler)"
  - "server.on('error', onError)"
  - "import { Server } from 'socket.io'"
  - "@app.on_event('startup')"
- kind: sso_flow
  description: code starts, completes, or checks an OAuth, OpenID Connect, or SAML sign-in
  anchor: site
  patterns:
  - '\bresponse_type=|[''"]response_type[''"]\s*:|\bredirect_uri=|[#&?]access_token='
  - '\bnew\s+\w{0,40}(?:OAuth2?|OIDC|OpenIDConnect|OpenIdConnect|Saml|SAML|Google|Azure\w{0,12})Strategy\s*\('
  - '\b(?:authorize_redirect|authorize_access_token|fetch_token|AuthCodeURL|authorizationUrl|getAuthorizationUrl|handleRedirectCallback|loginWithRedirect|signinRedirect(?:Callback)?|initImplicitFlow|initCodeFlow|initLoginFlow|loginPopup|acquireToken\w{0,12})\s*\('
  - '\.\s*(?:oauth2Login|saml2Login)\s*\(|@EnableOAuth2Sso\b|\bAdd(?:OpenIdConnect|OAuth|Google|MicrosoftAccount|Saml2)\s*\('
  - '\b(?:Issuer\s*\.\s*discover|oidc\s*\.\s*NewProvider|OneLogin_Saml2_Auth|OAuth2Session|WebApplicationClient)\s*\('
  - '\boauth2\s*\.\s*Config\s*\{|\boauth\s*\.\s*register\s*\('
  # openid-client 6 exposes functions instead of the Issuer and Client classes.
  - '\b(?:authorizationCodeGrant|buildAuthorizationUrl(?:WithPAR|WithJAR)?|randomPKCECodeVerifier|calculatePKCECodeChallenge)\s*\(|\bdiscovery\s*\(\s*new\s+URL\s*\('
  matches:
  - 'this.windowRefService.nativeWindow.location.replace(`${oauthProviderUrl}?client_id=${this.clientId}&response_type=token&scope=email&redirect_uri=${this.redirectUri}`)'
  - "if (path.includes('#access_token=')) {"
  - 'passport.use(new GoogleStrategy({ clientID, clientSecret, callbackURL }, verify))'
  - "const issuer = await Issuer.discover('https://accounts.example.com')"
  - 'token = oauth.google.authorize_access_token()'
  - 'http.oauth2Login(withDefaults());'
  - 'url := conf.AuthCodeURL(state, oauth2.AccessTypeOffline)'
  - 'const tokens = await client.authorizationCodeGrant(config, currentUrl, { pkceCodeVerifier, expectedState })'
  - 'const url = client.buildAuthorizationUrl(config, parameters)'
  - 'const config = await client.discovery(new URL(issuerUrl), clientId, clientSecret)'
  ignores:
  - "const services = await registry.discovery('orders')"
  - "import { OAuthComponent } from './oauth/oauth.component'"
  - 'public oauthUnavailable = true'
  - 'const redirectUrl = req.query.next'
  - "const accessToken = localStorage.getItem('token')"
- kind: auth_scheme
  description: code passes a credential or token in a URL, uses Basic authentication or a deprecated OAuth grant, or encodes a password itself
  anchor: site
  signal: credential_transport
  matches:
  - "return this.http.get('https://www.googleapis.com/oauth2/v1/userinfo?alt=json&access_token=' + accessToken)"
  - "this.userService.login({ email: profile.email, password: btoa(profile.email.split('').reverse().join('')), oauth: true })"
  - 'const token = req.query.token'
  - "api_key = request.args.get('api_key')"
  - "app.use(basicAuth({ users: { admin: process.env.ADMIN_PASSWORD } }))"
  - "headers: { Authorization: 'Basic ' + btoa(user + ':' + pass) }"
  - "body: new URLSearchParams({ grant_type: 'password', username, password })"
  ignores:
  - 'const token = req.headers.authorization'
  - "const plan = 'Basic plan'"
  - 'const term = req.query.q'
  - "this.router.navigate(['/search'], { queryParams: { q: value } })"
  - 'const tokenizer = query.tokenize(text)'
  - 'this.totpUrl = `otpauth://totp/${appName}:${email}?secret=${secret}&issuer=${appName}`'
