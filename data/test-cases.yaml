  post: []
  references: []
  fixtures: tests/fixtures/test-cases/TC-SESSION-01/
- id: TC-AUTHZ-01
  title: Object access checks the owner
  aspect: AuthZ
  stride:
  - Elevation of Privilege
  cwe:
  - CWE-639
  mode: seeded
  objective: Determine whether every access to user-owned objects in this component is bound to the authenticated caller or tenant.
  applies_when:
  - signal: object_id_routes
  starting_points:
    rules:
    - AUTHZ-001
    - AUTHZ-002
    - AUTHZ-301
    - ARCH-BOLA-001
    facts:
    - route_inventory.missing_authz_suspect
    - route_inventory.authn_signal
  guidance: Start with the candidates. Also check other entry points of the component that reach the same data, such as WebSocket handlers, GraphQL resolvers, jobs, or exports. Consider compensating controls such as ORM scopes, policies, or row-level security that the repository enforces. A control must bind every lookup of user-owned data that the handler makes for the request; binding one query does not protect another. A lookup by a transformed or non-unique attribute of the caller, such as a masked or truncated e-mail address or a display name, does not bind the object to the caller. Reject candidates that are public by design, with evidence. Routes that accept a request body are candidates as well, because the body can carry the object identifier, as in an update that takes the ID from the body. Include routes a framework generates from data models. The candidates list those of finale-rest and epilogue resources, marked generated; look for other generators yourself.
  scope: component
  controls:
  - Object-Level Authorization
  evidence:
    finding: request input, data access, and the location where the ownership check is missing
    control: location of the ownership comparison
  post:
  - check: route-registered
  - check: handler-chain-lacks-guard
    guard: ownership
  - check: variant-search
    pattern: same data-access pattern in other handlers of the component
  references: []
  fixtures: tests/fixtures/test-cases/TC-AUTHZ-01/
- id: TC-AUTHZ-02
  title: Privileged operations check the role or permission
  aspect: AuthZ
  stride:
  - Elevation of Privilege
  cwe:
  - CWE-285
  - CWE-862
  mode: seeded
  objective: Determine whether every privileged operation checks the caller's role or permission on the server.
  applies_when:
  - signal: routes
  starting_points:
    rules:
    - AUTHZ-302
    - ARCH-AUTHZ-001
    facts:
    - route_inventory.missing_authz_suspect
    - route_inventory.state_changing
    - route_inventory.authenticated_read_without_id
  guidance: Compare the operations a client interface offers only to administrators with the checks on the server. Check administrative routes registered outside the main router. Authenticated reads without an object identifier are candidates as well, because a list of other users' records is a privileged operation unless the server limits it to the caller. Include routes a framework generates from data models. The candidates list those of finale-rest and epilogue resources, marked generated; look for other generators yourself.
  scope: component
  controls:
  - Role-Based Access Control
  - Explicit Deny Baseline
  evidence:
    finding: privileged operation and the missing role or permission check
    control: location of the role or permission check
  post:
  - check: route-registered
  - check: handler-chain-lacks-guard
    guard: authorization
  references: []
  fixtures: tests/fixtures/test-cases/TC-AUTHZ-02/
- id: TC-AUTHZ-03
  title: Request bodies cannot set privileged fields
  aspect: AuthZ
  stride:
  - Tampering
  - Elevation of Privilege
  cwe:
  - CWE-915
  mode: seeded
  objective: Determine whether request bodies can set fields that only the server or a privileged role may set, such as role, owner, price, or status.
  applies_when:
  - signal: routes
  starting_points:
    rules:
    - AUTHZ-003
    - AUTHZ-004
    - AUTHZ-101
    - AUTHZ-102
    - AUTHZ-202
    - AUTHZ-PHP-002
    - AUTHZ-RB-002
    facts:
    - route_inventory.accepts_body
    abuse_cases:
    - AC-T-002
  guidance: Check create and update handlers that pass a request body to a model or ORM, and the field allow-lists they use. Include routes a framework generates from data models. The candidates list those of finale-rest and epilogue resources, marked generated; look for other generators yourself.
  scope: component
  controls:
  - Mass-Assignment Prevention
  evidence:
    finding: handler, the request body binding, and the privileged field it can set
    control: location of the field allow-list or explicit field assignment
  post: []
  references: []
  fixtures: tests/fixtures/test-cases/TC-AUTHZ-03/
- id: TC-AUTHZ-04
  title: Tenant data stays isolated
  aspect: AuthZ
  stride:
  - Information Disclosure
  - Elevation of Privilege
  cwe:
  - CWE-639
  - CWE-284
  mode: model
  objective: Determine whether data of one tenant is reachable only with that tenant's identity at every data access.
  applies_when:
  - signal: tenant_identifier
  starting_points:
    rules: []
    facts:
    - capability_signals.tenant_identifier
  guidance: Check that the tenant identifier comes from the authenticated identity and not from the request, and that queries, caches, and background jobs are scoped by it.
  scope: component
  controls:
  - Object-Level Authorization
  evidence:
    finding: data access without tenant scoping or with a client-supplied tenant identifier
    control: location of the tenant scope on the data access
  post: []
  references: []
  fixtures: tests/fixtures/test-cases/TC-AUTHZ-04/
- id: TC-AUTHZ-05
  title: Authorization the client interface implies is enforced on the server
  aspect: AuthZ
  stride:
  - Elevation of Privilege
  cwe:
  - CWE-602
  - CWE-285
  mode: model
  objective: Determine whether restrictions that the client interface implies, such as hidden buttons or disabled forms, are also enforced by the server.
  applies_when:
