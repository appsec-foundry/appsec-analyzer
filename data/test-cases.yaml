# test-cases.yaml: catalog of named security test cases (REQ-040).
#
# A test case is a security question for one aspect, not a detector. Scanner
# rules and facts are starting points, never limits. Only Analyzer's own
# package defines test cases; repository content cannot add, select, or
# disable them. Structure: schemas/test-cases.schema.yaml.
#
# mode: rules   - outcome follows from the rules, no model call by default
#       seeded  - rules seed a model investigation
#       model   - little or no rule support
#
# unmapped_rules lists scanner rules that are deliberately not a starting point.
version: 1
catalog_version: '4'
aspects:
- id: IAM
  title: Identity and authentication
- id: SessionMgmt
  title: Session management
- id: AuthZ
  title: Authorization
- id: InputVal
  title: Input handling
- id: DataProt
  title: Data protection
- id: Crypto
  title: Cryptography
- id: FrontendSec
  title: Frontend and mobile client security
- id: Audit
  title: Logging and auditing
- id: Availability
  title: Availability
- id: BusinessLogic
  title: Business logic
- id: AI
  title: AI features
- id: Infra
  title: Infrastructure
- id: SupplyChain
  title: Supply chain and CI
- id: DevTooling
  title: Developer tooling
test_cases:
- id: TC-AUTHN-01
  title: Sensitive routes, operations, and channels require authentication
  aspect: IAM
  stride:
  - Spoofing
  - Elevation of Privilege
  cwe:
  - CWE-306
  mode: seeded
  objective: Determine whether every route, operation, and channel that reaches sensitive data or functions requires an authenticated caller.
  applies_when:
  - signal: routes
  starting_points:
    rules:
    - AUTHZ-008
    - ARCH-AUTHN-001
    - ARCH-MGMT-001
    facts:
    - route_inventory.authn_signal
    - route_inventory.missing_authz_suspect
  guidance: Start with the unauthenticated route candidates. Also check non-HTTP entry points such as WebSocket handlers, GraphQL resolvers, jobs, and exports. Reject candidates that are public by design, with evidence.
  scope: component
  controls:
  - Password-Based Login
  - Anonymous Access (No Authentication)
  - WebSocket Authentication
  evidence:
    finding: route or channel, the sensitive operation it reaches, and the missing authentication check
    control: location where authentication is enforced for the route or channel
  post:
  - check: route-registered
  - check: handler-chain-lacks-guard
    guard: authentication
  references: []
  fixtures: tests/fixtures/test-cases/TC-AUTHN-01/
- id: TC-AUTHN-02
  title: Tokens are verified with a pinned algorithm and a server-held key
  aspect: IAM
  stride:
  - Spoofing
  cwe:
  - CWE-347
  - CWE-345
  mode: seeded
  objective: Determine whether every token the application accepts is verified with a pinned algorithm and a key held by the server.
  applies_when:
  - signal: jwt_usage
  starting_points:
    rules:
    - AUTHZ-005
    - AUTHZ-006
    - AUTHZ-007
    - AUTHZ-103
    - AUTHZ-201
    - AUTHZ-GO-001
    - AUTHZ-CS-001
    - AUTHZ-PHP-001
    - AUTHZ-RB-001
    - ARCH-JWT-001
  guidance: Check each place that parses or decodes tokens, including libraries wrapped by middleware. A decode without verification is a weakness only where its result is trusted.
  scope: component
  controls:
  - Session Token Validation (JWT Based)
  - Session Token Signing (JWT Based)
  evidence:
    finding: token parsing call and the missing or unpinned verification
    control: location of the verification call with its algorithm and key source
  post: []
  references: []
  fixtures: tests/fixtures/test-cases/TC-AUTHN-02/
- id: TC-AUTHN-03
  title: Token expiry, issuer, and audience are validated
  aspect: IAM
  stride:
  - Spoofing
  cwe:
  - CWE-345
  mode: seeded
  objective: Determine whether token lifetime, issuer, and audience are checked wherever tokens are accepted.
  applies_when:
  - signal: jwt_usage
  starting_points:
    rules:
    - AUTHZ-009
    - AUTHZ-104
    - AUTHZ-CS-003
  guidance: Distinguish explicitly disabled claim checks from library defaults and name the default when relying on it.
  scope: component
  controls:
  - Session Token Expiry
  - Session Token Validation (JWT Based)
  evidence:
    finding: verification call with the disabled or missing claim check
    control: location of the claim validation
  post: []
  references: []
  fixtures: tests/fixtures/test-cases/TC-AUTHN-03/
- id: TC-AUTHN-04
  title: Passwords are strong and stored with an adaptive hash
  aspect: IAM
  stride:
  - Spoofing
  - Information Disclosure
  cwe:
  - CWE-916
  - CWE-521
  mode: seeded
  objective: Determine whether passwords are subject to a minimum strength and stored only with an adaptive hash and a sufficient cost.
  applies_when:
  - signal: password_handling
  starting_points:
    rules:
    - AUTHN-002
    - CRYPTO-003
    - CRYPTO-001
    - CRYPTO-JAVA-001
    - CRYPTO-PY-001
    - CRYPTO-GO-001
    - CRYPTO-CS-001
    - CRYPTO-PHP-001
    - CRYPTO-RB-001
    - CRYPTO-KT-001
    - CRYPTO-SWIFT-001
    - CRYPTO-DART-001
  guidance: A broken hash in code that does not handle passwords belongs to TC-CRYPTO-01. Check registration, password change, and reset paths, not only login.
  scope: component
  controls:
  - Password Hashing
  - Password-Based Login
  - User Registration
  evidence:
    finding: password storage or policy code and the weak hash, cost, or policy
    control: location of the adaptive hash call with its cost and of the policy check
  post: []
  references: []
  fixtures: tests/fixtures/test-cases/TC-AUTHN-04/
- id: TC-AUTHN-05
  title: Recovery, re-authentication, and login responses resist takeover and enumeration
  aspect: IAM
  stride:
  - Spoofing
  - Information Disclosure
  cwe:
  - CWE-640
  - CWE-204
  mode: model
  objective: Determine whether account recovery, password change, and login responses prevent takeover and do not reveal which accounts exist.
  applies_when:
  - signal: password_handling
  starting_points:
    rules:
    - AUTHN-001
  guidance: Check whether a password change needs the current password, whether recovery relies on guessable answers, and whether responses and timing differ for known and unknown accounts.
  scope: component
  controls:
  - Password Reset
  - Password Change
  - Multi-Factor Verification (TOTP)
  evidence:
    finding: recovery, change, or login handler and the missing verification step
    control: location of the verification step or uniform response
  post: []
  references: []
  fixtures: tests/fixtures/test-cases/TC-AUTHN-05/
- id: TC-SESSION-01
  title: Session tokens are protected in storage, transport, lifetime, and logout
  aspect: SessionMgmt
  stride:
  - Spoofing
