- id: TC-INPUT-07
  title: Input cannot take control of what the server executes, stores, or reaches
  aspect: InputVal
  stride:
  - Tampering
  - Elevation of Privilege
  - Information Disclosure
  cwe: []
  mode: model
  goal: true
  objective: Determine whether untrusted input can make this component run code or commands of the attacker's choice, read or change stored data outside the intended query, or reach files, hosts, or resources it should not, by any interpreter, parser, or library.
  applies_when:
  - signal: routes
  starting_points:
    rules: []
  guidance: Start from the attacker's goal, not from a weakness class. For each goal, look for any path from request data, uploaded content, or stored values to the mechanism that would achieve it, including interpreters and libraries no other test case names, such as LDAP, XPath, expression languages, query builder fragments, template helpers, or prototype pollution. Give input, sink, and connection, and add a candidate for each path that achieves a goal. A finding that another test case of this aspect covers belongs to that test case.
  scope: component
  controls:
  - Input Schema Validation
  - Parameterized Database Access
  - Sandbox Isolation
  evidence:
    finding: input source, the mechanism it reaches, and what the attacker achieves
    control: location of the validation, binding, or isolation that stops it
  post:
  - check: site-reached
    site: any
  references: []
  fixtures: tests/fixtures/test-cases/TC-INPUT-07/
- id: TC-DATA-01
