  starting_points:
    rules: []
  guidance: Start from client code that hides or disables functions by role and follow each to its server endpoint.
  scope: component
  controls:
  - Role-Based Access Control
  evidence:
    finding: client restriction and the server endpoint that lacks the matching check
    control: location of the server-side check
  post: []
  references: []
  fixtures: tests/fixtures/test-cases/TC-AUTHZ-05/
- id: TC-AUTHZ-06
  title: Callers cannot read or change data beyond their rights
  aspect: AuthZ
  stride:
  - Information Disclosure
  - Tampering
  - Elevation of Privilege
  cwe: []
  mode: model
  goal: true
  objective: Determine whether a caller can read, change, or delete records of other users, or records that only privileged roles may change, by any path in this component.
  applies_when:
  - signal: routes
  starting_points:
    rules: []
  guidance: Start from the attacker's goal, not from a weakness class. List the component's data objects that belong to users or that only privileged roles may change, such as accounts, orders, baskets, balances, prices, and reviews, and check every way a request reaches each of them, including routes the candidates do not list, generated routes, bulk operations, and indirect writes. Add a candidate for each path that achieves the goal. A finding that another test case of this aspect covers belongs to that test case.
  scope: component
  controls:
  - Object-Level Authorization
  - Role-Based Access Control
  evidence:
    finding: the data object, the request path that reaches it, and the missing check
    control: location of the check that keeps the object out of reach
  post:
  - check: route-registered
  - check: handler-chain-lacks-guard
    guard: ownership
  - check: handler-chain-lacks-guard
    guard: authorization
  references: []
  fixtures: tests/fixtures/test-cases/TC-AUTHZ-06/
- id: TC-INPUT-01
