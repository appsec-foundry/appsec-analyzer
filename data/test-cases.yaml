  cwe:
  - CWE-613
  - CWE-1004
  - CWE-614
  mode: model
  objective: Determine whether session tokens are protected against theft and reuse in storage, transport, lifetime, and logout.
  applies_when:
  - signal: session_handling
  starting_points:
    rules:
    - ARCH-COOKIE-001
  guidance: Check cookie attributes, token storage in the browser, server-side invalidation at logout and password change, and session lifetime.
  scope: component
  controls:
  - Session Token Storage (Browser localStorage)
  - Session Token Revocation
  - Session Token Expiry
  evidence:
