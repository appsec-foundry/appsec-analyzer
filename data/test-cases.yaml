  guidance: 'Trace persisted input to its sink: a value stored earlier and used in a query later is request-derived. Give input, sink, and connection for injection findings. The candidates are code sites that fixed patterns found; examine other sites of the component too.'
  scope: component
  controls:
  - Parameterized Database Access
  evidence:
    finding: input source, the query construction, and the database connection
    control: location of the parameter binding or query builder
  post:
