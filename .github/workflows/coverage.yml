name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Offline tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APPSEC_LIVE_HOST: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: >-
          python -m pip install -e '.[requirements]'
          pytest==9.0.2 pytest-cov==7.1.0 'coverage[toml]==7.13.5'
      - name: Run offline suite
        run: make coverage-ci PYTHON=python
      - name: Save coverage report even when tests fail
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  codecov:
    name: Upload coverage
    needs: tests
    # Forks and Dependabot run tests without access to the repository secret.
    # Keep the token on a fresh runner that never installs or runs project code.
    if: >-
      ${{ !cancelled() && github.actor != 'dependabot[bot]' &&
          ((github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository) ||
           (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: .ci-coverage
      - name: Check upload token is configured
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::error::Add CODECOV_TOKEN under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Upload report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.3.1
          files: .ci-coverage/coverage.xml
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
          disable_telem: true
