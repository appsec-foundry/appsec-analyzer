name: Container image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - container/**
      - setup.py
      - pyproject.toml
      - tests/test_container_smoke.py
      - .github/workflows/container.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - container/**
      - setup.py
      - pyproject.toml
      - tests/test_container_smoke.py
      - .github/workflows/container.yml
  # Weekly: a Debian package version can disappear or receive a security update.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build image
        run: docker build --tag appsec-analyzer:ci .
      - name: Install test dependencies
        run: python -m pip install -e . pytest==9.0.2
      - name: Smoke-test image
        env:
          APPSEC_CONTAINER_IMAGE: appsec-analyzer:ci
        run: python -m pytest -q -rs -p no:cacheprovider tests/test_container_smoke.py

  pins:
    name: Check pinned versions
    # Dependabot updates the base image and Python packages; this job covers Debian packages and Claude CLI.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Report newer versions
        run: python container/check_pins.py
